name: Bug report
description: Something does not work as documented when you connect to or use the Maylee MCP server.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This repository is public: **never paste an access token, an API key, a password or the content of a real email.**
        For a security vulnerability, do not open an issue: follow [SECURITY.md](https://github.com/maylee-app/maylee-mcp/blob/main/SECURITY.md).
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude (claude.ai or Claude Desktop)
        - Claude Code
        - ChatGPT
        - Cursor
        - VS Code
        - Windsurf (Devin Desktop)
        - mcp-remote
        - Other
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client name and version
      placeholder: "Name and version, as shown in the About menu of the client"
  - type: dropdown
    id: auth
    attributes:
      label: Authentication
      options:
        - OAuth
        - API key
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or step involved
      description: A tool name, or the step of the connection that failed.
      placeholder: "list_emails, or the consent screen"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error code and message
      description: For example `INSUFFICIENT_SCOPE` or `401 invalid_token`, with the message. Remove any token or key first.
      render: text
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Date and time, with the timezone.
      placeholder: "2026-11-02 14:30 UTC+1"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report contains no access token, API key, password or real email content.
          required: true
